# Host settings for proxy-acl. Copy to /etc/sysctl.d/ and apply with
# `sysctl --system`. They affect the whole host.

# Let new outgoing connections reuse ports still in TIME_WAIT (safe for the
# connecting side; relies on TCP timestamps, on by default). Without it,
# the proxy can open only about 470 new connections per second to any one
# destination address and port.
net.ipv4.tcp_tw_reuse = 1
# More local ports for outgoing connections.
net.ipv4.ip_local_port_range = 10000 65535

# Strict reverse-path filtering: drop packets whose source address doesn't
# belong to the interface they arrived on, so a device can't claim an
# address from another VLAN's subnet. Each interface uses the higher of
# "all" and its own value, so also make sure no VLAN interface has
# net.ipv4.conf.<interface>.rp_filter = 2 (loose). IPv6 has no such
# setting; use a firewall rule (nftables: fib saddr . iif oif missing drop).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Only matters with 10 GbE and many tunnels open at once: lets zero-copy
# transfers keep 1 MB pipe buffers instead of 4 KB ones (0: no per-user limit).
#fs.pipe-user-pages-soft = 0
